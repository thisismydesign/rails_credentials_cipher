name: Release

# Pushing a v* tag publishes that version to RubyGems through trusted publishing;
# the tag MUST match the version in lib/rails_credentials_cipher/version.rb.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check the tag matches the version
        run: |
          version=$(bundle exec ruby -Ilib -e 'require "rails_credentials_cipher/version"; puts RailsCredentialsCipher::VERSION')
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }

      - uses: rubygems/release-gem@v1
